sName\":\"text-2xl font-semibold\",\"children\":\"Help\"}],[\"$\",\"p\",null,{\"children\":\"Help content goes here.\"}]]}],null,[\"$\",\"$L1f\",null,{\"children\":[\"$\",\"$20\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@21\"}]}]]}]\n17:[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$L23\",null,{\"children\":\"$L24\"}],[\"$\",\"$L26\",null,{\"children\":[[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$20\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L27\"}]}],null]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]\n19:[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/essence-tutor/preview/pr-64/_next/static/chunks/1yi4bdyycp964.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n28:I[30909,[\"$2\",\"$3\",\"$4\"],\"Sidebar\"]\n29:I[30909,[\"$2\",\"$3\",\"$4\"],\"SidebarHeader\"]\n2a:I[1843,[\"$2\",\"$3\",\"$4\"],\"ChapterSearch\"]\n14:C\n2b:T730,# Introduction\nWelcome to Essence Tutor!\n\nEssence is a modelling language used to describe and solve constraint satisfaction problems (CSPs). It is declarative, meaning you do not need to have knowledge of _how_ to solve such problems to be able to solve them.\n\n## What To Expect\nBy the end of this guide, you will have an understanding of CSPs and how to use Essence to model and solve them.\n\nEssence Tutor contains two types of material: notes and exercises. You will learn Essence concepts before putting them into practice by working with example models. You will also be given real-world problems to solve from scratch throughout.\n\n## How To Use This Guide\nEssence Tutor is composed of two parts: the learning material and the runner.\n\n\u003e **Don't want to use the runner?** No problem! You can follow the guide with any Markdown viewer and text editor using the files in the directory you created when you ran `estut new`. You may want to view the [Conjure documentation](https://conjure.readthedocs.io/en/latest/welcome.html) to learn how to run models yourself.\n\nThe runner is designed to be used alongside an editor of your choice. All you have to do is open a text editor in this directory and follow along!\n\n### Quick Tips!\nIf you're editing a model, the runner will automatically process it for you when you save your changes. \n\nAside from this, you will interact with the runner via the keyboard. The bar at the bottom (TBC) will show all actions you\ncan take at a given time. Here are some of the common ones:\n- `\u003center\u003e`: continue reading.\n- `c`: mark reading as complete.\n- `s`: skip task.\n- `r`: manually re-run model.\n- `q`/`\u003cesc\u003e`: quit.\n\n## Feedback?\nIf you have feedback on how Essence Tutor works for you or have run into a problem, let us know!\n[Submit an issue](https://github.com/conjure-cp/essence-tutor/issues/new).\n2c:T5f8,# CSPs and Constraint Programming\nCSPs are puzzles in which there are a number of entities that each hold certain constraints, or requirements, relating to how the world may be. Have you ever solved a [Sudoku](https://en.wikipedia.org/wiki/Sudoku) or completed a [Nonogram](https://en.wikipedia.org/wiki/Nonogram)? Congratulations, these are famous CSPs! \u003c!-- not sure I like this --\u003e\n\nConstraint programming involves working with computers to get them to solve these problems systematically. It is a form of artificial intelligence and is of great interest in Computer Science research.\n\n## Conjure and Essence\nAs we have mentioned, Essence is a language which allows us to formally define these problems. It does so in a way which is concise and can be interpreted easily.\n\nConjure is a tool which takes an Essence model, determines the best way to solve it and produces the results. It separates _how_ the model is solved from the constraints within the model.\n\nFrom this point in the guide, Conjure will be mentioned sparingly. If you would like to learn more about it, see the [Conjure documentation](https://conjure.readthedocs.io/).\n\n\u003e **Aside:** [Conjure Oxide](https://github.com/conjure-cp/conjure-oxide) is a re-write of Conjure in Rust and is the subject of the AI for Decision Making VIP at the University of St. Andrews. While it has not yet reached feature parity, you can try it out with Essence Tutor by \u003cinsert how that works here\u003e.\n\nIn the next section, we will see an example Essence model for a simple CSP.\n2d:Td00,# Model Structure\nEssence models can broadly be split into three sections: declarations, constraints and objectives. Together, they build a precise definition of the solution you are looking for that can be transferred between solvers.\n\n\u003e **Aside:** Domains describe the range of values something can be. You can think of them like data types or the bag of values that a solver can choose from. More on these later.\n\n## Declarations\nDeclarations are where you assign names to values (aliases), introduce changable values that will be provided alongside the model (parameters) and tell the solver the type of data it is going to search for (decision variables).\n\n### Aliases\nAliases can be thought of as similar to variables in traditional programming languages. You take an expression or a domain *(explain)*, and you assign a name to it which you can use throughout the rest of the model. This is done with `letting` statements.\n\n```\nletting \u003cname\u003e be \u003cexpression\u003e\nletting \u003cname\u003e be domain \u003cdomain\u003e\n```\n\nFor example, if you wanted to assign the expression `4 * 5` to the name `twenty`, you would do so as follows:\n\n```\nletting twenty be 4 * 5\n```\n_Let twenty refer to the value that is 4 times 5 (20)._\n\nSimilarly, if you wanted to easily refer to the domain of numbers between one and ten by the name `range`, you could do as follows:\n\n```\nletting range be domain int(1..5)\n```\n_Let range refer to the domain of integers between 1 and 5._\n\n### Parameters\nParameters are similar in that they assign a name to a provided value, only the provided value is not part of the model itself. When you declare that a parameter is expected, it will need to be provided in a separate file. You declare parameters using `given` statements, giving the domain it is expected to be.\n\n```\ngiven \u003cname\u003e : \u003cdomain\u003e\n```\n\nFor instance, if you wanted the user of your model to provide a variable temperature with the name `temp`, you could state the following:\n\n```\ngiven temp : int(-100..100)\n```\n_Given the parameter temp which is an integer between -100 and 100._\n\n### Decision Variables\nDecision variables are used to tell the solver what it is supposed to look for. These are declared alongside the domain they are expected to be within with `find` statements. You need one or more of these within your model for it to do anything useful.\n\n```\nfind \u003cname(s)\u003e : \u003cdomain\u003e\n```\n\nSay you wanted to look for an integer between one and ten and you wanted to call it `x`, you would then do the following:\n\n```\nfind x : int(1..10)\n```\n_Find an x which is an integer between 1 and 10._\n\n## Constraints\nConstraints are where you tell the solver the conditions that the values it finds must satisfy. For example, that the number `x` must be twice that of `y`. You do this with `such that` statements with expressions which outline said conditions.\n\n```\nsuch that \u003cexpression\u003e\n```\n\nUsing the example mentioned before, you would do as follows:\n\n```\nsuch that x = 2 * y\n```\n_Such that x must be two times y._\n\n## Objectives\nFinally, objectives optionally tell the solver additional requirements, like that it needs to minimise or maximise a final result.\n\n```\nminimising \u003cexpression\u003e\nmaximising \u003cexpression\u003e\n```\n\nSay you wanted to minimise the value of `x`, you would include this in the model like so:\n\n```\nminimising x\n```\n_Making x as small as possible._\n2e:T10a9,# Logic Operations\nYou can perform logic operations on declarations with a Boolean domain to create statements which hold an overall logical truth-value.\n\n## The Fundamental Operations\nThis part covers the fundamental logical operators in detail. If you already know these, feel free to skip!\n\n### AND (Conjunction)\nEssence uses `/\\` as its logical AND operator. For an AND operation to be true, both operands also must be true.\n\n`x /\\ y` can be read as *\"x and y\"* and has the following truth table:\n\n| `x`   | `y`   | `x /\\ y` |\n|-------|-------|----------|\n| true  | true  | true     |\n| true  | false | false    |\n| false | true  | false    |\n| false | false | false    |\n\n### OR (Disjunction)\nEssence uses `\\/` as its logical OR operator. For an OR operation to be true, one or more of its operands must be true.\n\n`x \\/ y` can be read as *\"x or y\"* and has the following truth table:\n\n| `x`   | `y`   | `x \\/ y` |\n|-------|-------|----------|\n| true  | true  | true     |\n| true  | false | true     |\n| false | true  | true     |\n| false | false | false    |\n\n### Implies (If-Then)\nEssence uses `-\u003e` to denote implies.\n\nImplies takes two operands: an antecedent and a consequent. It effectively states that if the antecedent is true then the consequent must also be true. For an implies operation to be true, then, it must *not* be the case that the antecedent can be true and the consequent be false.\n\n\u003e **Tip:** This is confusing at first for some. Remember that it's only one-way! \n\u003e To illustrate, the statement *\"the Sun is blue implies Earth has land\"* is *always* true because the colour of the Sun has no bearing on the fact Earth has land. Earth has land whether or not the Sun is blue.\n\n`x -\u003e y` can be read as *\"x implies y\"* or *\"if x, then y\"* and has the following truth table:\n\n| `x`   | `y`   | `x -\u003e y` |\n|-------|-------|----------|\n| true  | true  | true     |\n| true  | false | false    |\n| false | true  | true     |\n| false | false | true     |\n\n### If And Only If (Iff)\nEssence uses `\u003c-\u003e` to denote iff.\n\nOnce again, iff takes two operands: an antecedent and a consequent. The difference is that now it works both ways: it is only true if the antecedent and consequent have the same truth-value.\n\n`x \u003c-\u003e y` can be read as *\"if and only if (iff) x, then y\"* and has the following truth table:\n\n| `x`   | `y`   | `x \u003c-\u003e y` |\n|-------|-------|-----------|\n| true  | true  | true      |\n| true  | false | false     |\n| false | true  | false     |\n| false | false | true      |\n\n\u003e **Aside:** Notice that the truth table for `\u003c-\u003e` is the same as other logical operators. That is because it is equivalent to the identity relation or to XOR. It can also be expanded to the AND of two implies statements.\n\n### NOT (Negation)\nFinally, Essence uses `!` as its logical NOT operator. For a NOT operation to be true, it's sole operand must be false.\n\n`!x` can be read as *\"not x\"* and has the following truth table:\n\n| `x`   | `!x`  |\n|-------|-------|\n| true  | false |\n| false | true  |\n\n## Combining Operators\nLogical operators can be combined to create complex logical statements.\n\nFor example, if you wanted to know whether it's true that both the hare (Rh) and the tortoise (Rt) are taking part in the race, and either the hare (Wh) or the tortoise (Wt) will win, you could join them together like so:\n\n```\n(Rh /\\ Rt) /\\ (Wh \\/ Wt)\n```\n*Hare is racing and tortoise is racing, and hare will win or tortoise will win.*\n\n## Order Of Precedence\nLogical operators have an order of precedence much like typical arithmetic operators. That which is of a higher precedence will be evaluated first.\n\nThe standard order of precedence (highest first) is:\n- Brackets\n- NOT `!`\n- AND `/\\`\n- OR `\\/`\n- Implies `-\u003e`\n- Iff `\u003c-\u003e`\n\nLook at the following example:\n\n```\nx \\/ !y /\\ !(z -\u003e y) \u003c-\u003e x\n```\n\nThis looks complicated, so let's break it down, adding brackets to make things more clear:\n- Brackets are evaluated first, so `z -\u003e y` will be worked out first.\n- NOT is next, so the next subformulae to be worked out are `!y` and `!(z -\u003e y)`.\n- Now we look at AND, so `!y /\\ !(z -\u003e y)` is next.\n- After this we look at OR, so `x \\/ (!y /\\ !(z -\u003e y))` is evaluated.\n- Finally, we look at iff, and we evaluate the overall statement `(x \\/ (!y /\\ !(z -\u003e y))) \u003c-\u003e x`.\n2f:T9fb,# The Integer Domain\nInteger domains are used to refer to a set of whole numbers. This set can be constrained to a range or can be left open.\n\nSome properties:\n- An integer domain which is declared with a range that has a start and end value is finite. This is the _only_ way to declare a finite integer domain.\n- If you do not specify one of the start or end, or do not specify a range at all, then the domain will be _infinite_.\n- You cannot declare a decision variable with an infinite integer domain.\n\nYou can declare an integer domain using the keyword `int`.\n3. `int(expression)` refers to the integer domain with bounds described by the expression.\n\n## Unbounded\nYou can refer to the infinite integer domain (-infty to +infty) with the keyword `int` alone.\n\nFor example, if you wanted to declare an alias `a` which refers to the infinite integer domain, you would write the following in your model:\n\n```\nletting a be domain int\n```\n*Let a refer to the infinite domain of integers.*\n\nRemember, since this domain is infinite you cannot use it when declaring decision variables.\n\n```\n$ Invalid!\nfind b : int\n```\n\n## Bounded By Range(s)\nYou can also refer to a bounded integer domain by using ranges alongside `int`. These can be finite or infinite, depending on the parameters you give the range.\n\nLet's look at how ranges work before we go further:\n- Ranges are declared using the syntax `start..end`, which refers to the values between `start` and `end`.\n    - `1..10` refers to the values between one and ten.\n- You can omit either `start` or `end` as a bound for integers to create an infinite range.\n    - `1..` refers to the values from one up to +infty.\n    - `..10` refers to the values from -infty to ten.\n\nPutting this together, you declare integer domains bounded by ranges with the syntax `int(r1, r2, ...)` where `r1`, `r2`, ... are ranges.\n\nFor example, if you wanted to declare a decision variable `c` with the integer domain bounded between one and ten or negative ten and negative one, you would write the following in your model:\n\n```\nfind c : int(1..10, -10..-1)\n```\n*Find a c which may be any integer from 1 to 10 or from -10 to -1.*\n\nSimilarly, if you wanted to declare an alias `d` which refers to the integer domain bounded from one to +infty, you would write the following:\n\n```\nletting d be domain int(1..)\n```\n*Find a d which may be any integer from 1 to +infty.*\n\nOnce again, remember you cannot declare decision variables with an infinite domain.\n\n```\n$ Invalid!\nfind e : int(..10)\n```\n\n## Bounded By An Expression\n!! TODO\n30:Td11,# Basic Domains\nThe last section briefly introduced you to domains. To recap, these define the range of values that any given variable or declaration can hold. You can think of them as similar to that of data types in traditional programming languages, or the bag from which a value can be chosen.\n\nDomains can refer to a finite or infinite set of values, but infinite domains can only be used for aliases and parameters.\n\nFor now we will focus on Booleans, integers, tuples and sets. You will be introduced to more domains as you progress through this guide.\n\n## Booleans (`bool`)\nBoolean domains can be one of either `true` or `false`. They are always finite.\n\nFor example, if you wanted to find a Boolean decision variable `x`, you would write the following:\n\n```\nfind x : bool\n```\n\nAn important caveat with Boolean domains is that they do not currently support objective statements. That means they cannot directly be minimised or maximised.\n\n## Integers (`int`)\nInteger domains refer to a set of whole numbers. They can be used in a few ways:\n- `int` refers to the infinite set of integers.\n- `int(r1,r2,...)` refers to an integer within one or more of the ranges `r1`, `r2`, etc. These can be finite or infinite.\n- `int(expression)` refers to an integer within the bounds described by the expression.\n\nRanges have the syntax `start..end`, where only one of `start` and `end` is required. For example:\n- `int(1..10)` refers to the finite set of integers from one to ten.\n- `int(1..)` refers to the infinite set of all integers that are greater than or equal to one.\n- `int(..10)` refers to the infinite set of integers that are less than or equal to ten.\n\nTo avoid unexpected results, values in an integer domain should be between $-2^{62}+1$ and $2^{62}-1$.\n\nFor example, if you wanted to declare an unbounded integer parameter `x`, you would write the following:\n\n```\ngiven x : int\n```\n\nIf you wanted to find an integer decision variable `y` within the range -100 to 100, you would write the following:\n\n```\nfind y : int(-100..100)\n```\n\nYou can also state specific values. So if you wanted to find an integer decision variable `z` that could only be 10 or 25, you would write the following:\n\n```\nfind z : int(10,25)\n```\n\n## Tuples (`tuple`)\nTuples domains refer to a tuple of any arity with values of any domain. You can use the `tuple` keyword to denote a tuple or, where the tuple's arity is two or more, you can simply surround the domains with brackets.\n\nYou can refer to domains inside a tuple using their positions, starting from 1.\n\nFor example, if you wanted to declare a decision variable `x` which would find a two-arity tuple of integers between 1 and 10, you would write the following:\n\n```\nfind x : (int(1..10),int(1..10))\n```\n\n## Sets (`set`)\nSet domains refer to a set of any size containing values of any domain. They can be used in a one of two ways:\n- `set(size,minSize,maxSize) of domain` refers to a set with optional cardinality attributes (size) containing values of a domain.\n- `{1,2,3}` refers to an integer set containing the numbers `1`, `2` and `3`.\n\nIf you wanted to declare a decision variable `x` which is a set of size 2, you would write the following:\n\n```\nfind x : set(2)\n```\n\nIf you wanted to declare an alias `y` which is the set `{1,2,3}`, you would write the following:\n\n```\nletting y be {1,2,3}\n````\n8:[\"$\",\"$L28\",null,{\"variant\":\"floating\",\"children\":[[\"$\",\"$L29\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-lg font-bold\",\"children\":\"Essence Tutor\"}],[\"$\",\"$L2a\",null,{\"entries\":[{\"chapterUrlFriendly\":\"00-first-steps\",\"chapterTitle\":\"First steps\",\"lessonUrlFriendly\":\"01-introduction\",\"lessonTitle\":\"Introduction\",\"content\":\"$2b\"},{\"chapterUrlFriendly\":\"00-first-steps\",\"chapterTitle\":\"First steps\",\"lessonUrlFriendly\":\"02-constraint-problems\",\"lessonTitle\":\"CSPs and Constraint Programming\",\"content\":\"$2c\"},{\"chapterUrlFriendly\":\"00-first-steps\",\"chapterTitle\":\"First steps\",\"lessonUrlFriendly\":\"03-essence\",\"lessonTitle\":\"Essence\",\"content\":\"# Essence\\nSo, why use Essence?\\n\\nThere are a number of reasons, but they all essentially come back to making it easier to get computers to solve CSPs.\\n\\n- Essence provides a standard way of describing problems; you don't have to understand (or even care about!) the ways in which different kinds of problems are solved. Instead, you tell the computer what you want to achieve and it figures it out for you.\\n- It is a high-level language for working with problems which you can plug into a variety of solvers. You don't need to know how to communicate with any specifically, just write your problem description in Essence and it can be translated.\\n\\n## A First Model\\nSo, let's have a look at a first model and some of the basic constructs you will use when writing Essence. In the next section we will look at a model which solves a simple problem.\\n\"},{\"chapterUrlFriendly\":\"01-model-structure\",\"chapterTitle\":\"Model structure\",\"lessonUrlFriendly\":\"01-model-structure\",\"lessonTitle\":\"Model Structure\",\"content\":\"$2d\"},{\"chapterUrlFriendly\":\"02-booleans\",\"chapterTitle\":\"Booleans\",\"lessonUrlFriendly\":\"01-the-boolean-domain\",\"lessonTitle\":\"The Boolean Domain\",\"content\":\"# The Boolean Domain\\nBoolean domains are used to express the truth-value of logical constructs. Something with a Boolean domain can be of the value `true` or `false`.\\n\\nSome properties:\\n- Declarations with the Boolean domain can hold one of the values `true` or `false`.\\n- The Boolean domain is finite, since there are only two possible values within it.\\n- Objective statements cannot be used on declarations with a Boolean domain at this time. That means they cannot be directly minimised or maximised.\\n\\nThe keyword `bool` is used to denote this domain. So, if you wanted to declare a decision variable `a` with a Boolean domain, you would write the following in your model:\\n\\n```\\nfind a : bool\\n```\\n*Find an a which is either true or false.*\\n\\nRemember you can't directly minimise or maximise a Boolean!\\n\\n```\\n$ Invalid!\\nmaximise a\\n```\\n\"},{\"chapterUrlFriendly\":\"02-booleans\",\"chapterTitle\":\"Booleans\",\"lessonUrlFriendly\":\"02-logic-operations\",\"lessonTitle\":\"Logic Operations\",\"content\":\"$2e\"},{\"chapterUrlFriendly\":\"03-integers\",\"chapterTitle\":\"Integers\",\"lessonUrlFriendly\":\"01-the-integer-domain\",\"lessonTitle\":\"The Integer Domain\",\"content\":\"$2f\"},{\"chapterUrlFriendly\":\"03-integers\",\"chapterTitle\":\"Integers\",\"lessonUrlFriendly\":\"02-arithmetic-and-comparison\",\"lessonTitle\":\"Arithmetic and Comparison\",\"content\":\"# Arithmetic and Comparison\\nEssence includes the standard arithmetic and comparison operators.\\n\\n## Arithmetic\\n- `x + y` - addition.\\n- `x - y` - subtraction.\\n- `x * y` - multiplication.\\n- `x / y` - *integer* division.\\n- `x % y` - modulo (remainder of `x` divided by `y`).\\n- `x ** y` - exponential (`x` to the power of `y`).\\n- `x!` or `factorial(x)` - factorial.\\n- `|x|` - absolute value (positive value).\\n\\n## Comparison\\n- `x = y` - equality (notice that it's one symbol!).\\n- `x != y` - inequality.\\n- `x \u003c y` - less than.\\n- `x \u003c= y` - less than or equal to.\\n- `x \u003e y` - greater than.\\n- `x \u003e= y` - greater than or equal to.\\n\"},{\"chapterUrlFriendly\":\"99-misc\",\"chapterTitle\":\"Misc\",\"lessonUrlFriendly\":\"02-basic-domains\",\"lessonTitle\":\"Basic Domains\",\"content\":\"$30\"}]}]]}],\"$L31\",\"$L32\"]}]\n33:I[30909,[\"$2\",\"$3\",\"$4\"],\"SidebarGroup\"]\n34:\"SidebarGroupContent\"\n35:I[30909,[\"$2\",\"$3\",\"$4\"],\"$34\"]\n36:I[30909,[\"$2\",\"$3\",\"$4\"],\"SidebarMenu\"]\n37:I[69990,[\"$2\",\"$3\",\"$4\"],\"ChapterMenu\"]\n38:I[30909,[\"$2\",\"$3\",\"$4\"],\"SidebarFooter\"]\n39:I[30909,[\"$2\",\"$3\",\"$4\"],\"SidebarMenuItem\"]\n3a:\"SidebarMenuButton\"\n3b:I[30909,[\"$2\",\"$3\",\"$4\"],\"$3a\"]\n3c:I[77663,[\"$2\",\"$3\",\"$4\"],\"\"]\n31:[\"$\",\"$L33\",null,{\"className\":\"overflow-x-hidden\",\"children\":[\"$\",\"$L35\",null,{\"children\":[[\"$\",\"$L36\",null,{\"children\":[\"$\",\"span\",null,{\"className\":\"text-lg\",\"children\":\"Chapters\"}]}],[\"$\",\"$L36\",null,{\"children\":[\"$\",\"$L37\",null,{\"chapters\":[{\"urlFriendly\":\"00-first-steps\",\"title\":\"First steps\",\"lessons\":[{\"urlFriendly\":\"01-introduction\",\"title\":\"Introduction\"},{\"urlFriendly\":\"02-constraint-problems\",\"title\":\"CSPs and Constraint Programming\"},{\"urlFriendly\":\"03-essence\",\"title\":\"Essence\"}]},{\"urlFriendly\":\"01-model-structure\",\"title\":\"Model structure\",\"lessons\":[{\"urlFriendly\":\"01-model-structure\",\"title\":\"Model Structure\"}]},{\"urlFriendly\":\"02-booleans\",\"title\":\"Booleans\",\"lessons\":[{\"urlFriendly\":\"01-the-boolean-domain\",\"title\":\"The Boolean Domain\"},{\"urlFriendly\":\"02-logic-operations\",\"title\":\"Logic Operations\"}]},{\"urlFriendly\":\"03-integers\",\"title\":\"Integers\",\"lessons\":[{\"urlFriendly\":\"01-the-integer-domain\",\"title\":\"The Integer Domain\"},{\"urlFriendly\":\"02-arithmetic-and-comparison\",\"title\":\"Arithmetic and Comparison\"}]},{\"urlFriendly\":\"99-misc\",\"title\":\"Misc\",\"lessons\":[{\"urlFriendly\":\"02-basic-domains\",\"title\":\"Basic Domains\"}]}]}]}]]}]}]\n32:[\"$\",\"$L38\",null,{\"children\":[\"$\",\"$L36\",null,{\"children\":[\"$\",\"$L39\",null,{\"children\":[\"$\",\"$L3b\",null,{\"render\":[\"$\",\"$L3c\",null,{\"href\":\"/help\"}],\"children\":[\"$\",\"span\",null,{\"children\":\"Help\"}]}]}]}]}]\n24:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n3d:I[47089,[\"$2\",\"$3\",\"$4\"],\"IconMark\"]\n21:null\n27:[[\"$\",\"title\",\"0\",{\"children\":\"Essence Tutor\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Learn Essence from scratch\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/essence-tutor/preview/pr-64/favicon.ico?favicon.117ezoe8m31dk.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"$L3d\",\"3\",{}]]\n"])</script></body></html>
